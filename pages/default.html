<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basic Website</title>
</head>
<body style="margin:0; font-family:Arial, sans-serif; background:rgb(244, 244, 244); color:rgb(34, 34, 34);">

    <!-- Navbar -->
    <div style="background:rgb(17, 17, 17); padding:15px 30px; color:rgb(255, 255, 255);">
        <h1 style="margin:0;">My Website</h1>
    </div>

    <!-- Hero Section -->
    <div style="padding:80px 20px; text-align:center; background:rgb(255, 255, 255);">
        <h1 style="font-size:40px; margin-bottom:10px; color: rgb(100,200,10);">Welcome!</h2>
        <p style="font-size:18px; color:rgb(85, 85, 85);">
            This is a super basic HTML page using only inline CSS.
        </p>

        <button style="
            margin-top:20px;
            padding:12px 24px;
            border:none;
            background:rgb(17, 17, 17);
            color:rgb(255, 255, 255);
            font-size:16px;
            cursor:pointer;
            border-radius:8px;
        ">
            Click Me
        </button>
    </div>

    <!-- Cards -->
    <div style="
        display:flex;
        gap:20px;
        padding:40px;
        flex-wrap:wrap;
        justify-content:center;
    ">
        <div style="
            background:rgb(255, 255, 255);
            padding:20px;
            width:250px;
            border-radius:12px;
            box-shadow:0 4px 10px rgba(0,0,0,0.1);
        ">
            <h3>Card One</h3>
            <p>Some random text here for the first card.</p>
        </div>

        <div style="
            background:rgb(255, 255, 255);
            padding:20px;
            width:250px;
            border-radius:12px;
            box-shadow:0 4px 10px rgba(0,0,0,0.1);
        ">
            <h3>Card Two</h3>
            <p>Another card floating in the HTML soup</p>
        </div>
    </div>

    <!-- Footer -->
    <div style="
        background:rgb(17, 17, 17);
        color:rgb(255, 255, 255);
        text-align:center;
        padding:20px;
    ">
        © 2026 My Website
    </div>

</body>
</html>
