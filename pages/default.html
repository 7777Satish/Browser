<!DOCTYPE html>
<html>
<head>
    <title>Dashboard Layout</title>
</head>
<body style="margin:0px;background:rgb(235,235,235);font-family:Arial;">

    <div style="height:70px;background:rgb(35,35,35);display:flex;">
        <div style="width:250px;padding:10px 0px 0px 20px;color:rgb(255,255,255);font-size:24px;font-weight:bold;">
            Nexus
        </div>

        <div style="flex:1;padding:18px 0px 0px 0px;">
            <input type="text" style="width:400px;height:32px;background:rgb(55,55,55);border:1px solid rgb(80,80,80);color:rgb(255,255,255);padding:0px 10px 0px 10px;">
            </input>
        </div>

        <div style="display:flex;width:300px;padding:15px 20px 0px 0px;text-align:right;">
            <div style="display:inline-block;width:40px;height:40px;background:rgb(90,90,90);margin:0px 10px 0px 0px;"></div>
            <div style="display:inline-block;width:40px;height:40px;background:rgb(90,90,90);margin:0px 10px 0px 0px;"></div>
            <div style="display:inline-block;width:40px;height:40px;background:rgb(120,120,120);"></div>
        </div>
    </div>

    <div style="display:flex;">

        <div style="width:240px;background:rgb(45,45,45);min-height:1200px;">

            <div style="padding:20px 20px 20px 20px;color:rgb(255,255,255);font-size:18px;">
                Dashboard
            </div>

            <div style="padding:20px 20px 20px 20px;color:rgb(220,220,220);">
                Analytics
            </div>

            <div style="padding:20px 20px 20px 20px;color:rgb(220,220,220);">
                Projects
            </div>

            <div style="padding:20px 20px 20px 20px;color:rgb(220,220,220);">
                Team
            </div>

            <div style="padding:20px 20px 20px 20px;color:rgb(220,220,220);">
                Files
            </div>

            <div style="padding:20px 20px 20px 20px;color:rgb(220,220,220);">
                Settings
            </div>

        </div>

        <div style="flex:1;padding:20px 20px 20px 20px;">

            <div style="display:flex;margin:0px 0px 20px 0px;">

                <div style="flex:1;height:120px;background:rgb(255,255,255);margin:0px 20px 0px 0px;padding:20px 20px 20px 20px;">
                    <div style="font-size:14px;color:rgb(120,120,120);">Revenue</div>
                    <div style="font-size:36px;color:rgb(40,40,40);padding:15px 0px 0px 0px;">$48,920</div>
                </div>

                <div style="flex:1;height:120px;background:rgb(255,255,255);margin:0px 20px 0px 0px;padding:20px 20px 20px 20px;">
                    <div style="font-size:14px;color:rgb(120,120,120);">Users</div>
                    <div style="font-size:36px;color:rgb(40,40,40);padding:15px 0px 0px 0px;">12,480</div>
                </div>

                <div style="flex:1;height:120px;background:rgb(255,255,255);padding:20px 20px 20px 20px;">
                    <div style="font-size:14px;color:rgb(120,120,120);">Orders</div>
                    <div style="font-size:36px;color:rgb(40,40,40);padding:15px 0px 0px 0px;">1,294</div>
                </div>

            </div>

            <div style="display:flex;margin:0px 0px 20px 0px;">

                <div style="flex:2;background:rgb(255,255,255);height:350px;margin:0px 20px 0px 0px;padding:20px 20px 20px 20px;">

                    <div style="font-size:20px;color:rgb(40,40,40);margin:0px 0px 20px 0px;">
                        Performance
                    </div>

                    <div style="display:flex;height:220px;">

                        <div style="width:60px;height:120px;background:rgb(80,120,220);margin:100px 20px 0px 0px;"></div>
                        <div style="width:60px;height:180px;background:rgb(80,120,220);margin:40px 20px 0px 0px;"></div>
                        <div style="width:60px;height:140px;background:rgb(80,120,220);margin:80px 20px 0px 0px;"></div>
                        <div style="width:60px;height:200px;background:rgb(80,120,220);margin:20px 20px 0px 0px;"></div>
                        <div style="width:60px;height:160px;background:rgb(80,120,220);margin:60px 20px 0px 0px;"></div>
                        <div style="width:60px;height:220px;background:rgb(80,120,220);margin:0px 20px 0px 0px;"></div>

                    </div>

                </div>

                <div style="width:320px;background:rgb(255,255,255);height:350px;padding:20px 20px 20px 20px;">

                    <div style="font-size:20px;color:rgb(40,40,40);margin:0px 0px 20px 0px;">
                        Activity
                    </div>

                    <div style="height:50px;background:rgb(245,245,245);margin:0px 0px 10px 0px;padding:15px 15px 15px 15px;">
                        New signup
                    </div>

                    <div style="height:50px;background:rgb(245,245,245);margin:0px 0px 10px 0px;padding:15px 15px 15px 15px;">
                        Payment received
                    </div>

                    <div style="height:50px;background:rgb(245,245,245);margin:0px 0px 10px 0px;padding:15px 15px 15px 15px;">
                        Project updated
                    </div>

                    <div style="height:50px;background:rgb(245,245,245);padding:15px 15px 15px 15px;">
                        Server backup
                    </div>

                </div>

            </div>

            <div style="display:flex;">

                <div style="flex:1;background:rgb(255,255,255);padding:20px 20px 20px 20px;margin:0px 20px 0px 0px;">

                    <div style="font-size:20px;color:rgb(40,40,40);margin:0px 0px 20px 0px;">
                        Team Members
                    </div>

                    <div style="display:flex;margin:0px 0px 15px 0px;">
                        <div style="width:50px;height:50px;background:rgb(180,180,180);margin:0px 15px 0px 0px;"></div>
                        <div>
                            <div>Alex</div>
                            <div style="color:rgb(120,120,120);">Designer</div>
                        </div>
                    </div>

                    <div style="display:flex;margin:0px 0px 15px 0px;">
                        <div style="width:50px;height:50px;background:rgb(180,180,180);margin:0px 15px 0px 0px;"></div>
                        <div>
                            <div>Emma</div>
                            <div style="color:rgb(120,120,120);">Developer</div>
                        </div>
                    </div>

                    <div style="display:flex;">
                        <div style="width:50px;height:50px;background:rgb(180,180,180);margin:0px 15px 0px 0px;"></div>
                        <div>
                            <div>James</div>
                            <div style="color:rgb(120,120,120);">Manager</div>
                        </div>
                    </div>

                </div>

                <div style="flex:1;background:rgb(255,255,255);padding:20px 20px 20px 20px;">

                    <div style="font-size:20px;color:rgb(40,40,40);margin:0px 0px 20px 0px;">
                        Tasks
                    </div>

                    <div style="height:45px;background:rgb(245,245,245);margin:0px 0px 10px 0px;padding:15px 15px 15px 15px;">
                        Landing page redesign
                    </div>

                    <div style="height:45px;background:rgb(245,245,245);margin:0px 0px 10px 0px;padding:15px 15px 15px 15px;">
                        API integration
                    </div>

                    <div style="height:45px;background:rgb(245,245,245);padding:15px 15px 15px 15px;">
                        QA testing
                    </div>

                </div>

            </div>

        </div>

    </div>

</body>
</html>
