<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin-top: 0px;
      margin-right: 0px;
      margin-bottom: 0px;
      margin-left: 0px;
      background: rgb(25, 25, 25);
      font-family: sans-serif;
      width: 1920px;
      height: 1080px;
    }

    .top-nav {
      width: 340px;
      display: flex;
      flex-direction: row;
      padding-top: 30px;
      padding-left: 1400px;
    }

    .nav-link {
      display: flex;
      color: rgb(255, 255, 255);
      font-size: 14px;
      text-decoration-line: none;
      padding-left: 20px;
      padding-right: 20px;
      font-weight: bold;
    }

    .search-section {
      padding-top: 180px;
      padding-left: 610px;
    }

    .logo {
      color: rgb(255, 255, 255);
      font-size: 85px;
      font-weight: bold;
      margin-top: 0px;
      margin-bottom: 40px;
      margin-left: 0px;
      margin-right: 0px;
      padding-left: 105px;
    }

    .search-box {
      display: flex;
      flex-direction: row;
      width: 700px;
      height: 54px;
      background: rgb(255, 255, 255);
      border-radius: 27px;
      margin-top: 0px;
      margin-bottom: 0px;
      margin-left: 0px;
      margin-right: 0px;
    }

    .search-input {
      display: flex;
      width: 610px;
      height: 50px;
      background: rgb(255, 255, 255);
      color: rgb(0, 0, 0);
      font-size: 18px;
      padding-top: 0px;
      padding-bottom: 0px;
      padding-left: 25px;
      padding-right: 0px;
      border-width: 0px;
      border-radius: 27px;
      outline-width: 0px;
      margin-top: 2px;
      margin-bottom: 0px;
      margin-left: 2px;
      margin-right: 0px;
    }

    .search-icon {
      padding-top: 15px;
      padding-left: 15px;
      font-size: 20px;
      color: rgb(100, 100, 100);
    }

    .news-section {
      display: flex;
      flex-direction: row;
      /* padding-top: 300px; */
      padding-left: 0px;
      margin-left: 115px;
    }

    .news-card {
      display: flex;
      flex-direction: column;
      width: 310px;
      height: 240px;
      background: rgb(35, 35, 35);
      margin-right: 25px;
      border-radius: 12px;
      text-decoration-line: none;
    }

    .news-img-1 {
      background: rgb(45, 90, 140);
      height: 140px;
      width: 310px;
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
    }

    .news-img-2 {
      background: rgb(140, 60, 45);
      height: 140px;
      width: 310px;
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
    }

    .news-img-3 {
      background: rgb(45, 140, 80);
      height: 140px;
      width: 310px;
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
    }

    .news-img-4 {
      background: rgb(140, 110, 45);
      height: 140px;
      width: 310px;
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
    }

    .news-img-5 {
      background: rgb(90, 45, 140);
      height: 140px;
      width: 310px;
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
    }

    .news-title {
      color: rgb(255, 255, 255);
      font-size: 15px;
      font-weight: bold;
      margin-top: 15px;
      margin-bottom: 10px;
      margin-left: 0px;
      margin-right: 0px;
      padding-left: 15px;
      padding-right: 15px;
    }

    .news-source {
      color: rgb(180, 180, 180);
      font-size: 12px;
      padding-left: 15px;
    }
  </style>
</head>
<body>
  <div class="top-nav">
    <a href="#" class="nav-link">Copilot</a>
    <a href="#" class="nav-link">Images</a>
    <a href="#" class="nav-link">Videos</a>
    <a href="#" class="nav-link">Maps</a>
    <a href="#" class="nav-link">News</a>
  </div>

  <div class="search-section">
    <h1 class="logo">Santra</h1>
    <form class="search-box" action="https://bing.com/search" method="get">
      <input class="search-input" type="text" name="q" autofocus />
      <!-- <div class="search-icon">&#128269;</div> -->
    </form>
  </div>

  <div class="news-section">
    <a href="#" class="news-card">
      <div class="news-img-1"></div>
      <div class="news-title">Global Markets See Sudden Surge</div>
      <div class="news-source">Financial Times</div>
    </a>
    <a href="#" class="news-card">
      <div class="news-img-2"></div>
      <div class="news-title">New Mars Rover Transmits Images</div>
      <div class="news-source">Science Daily</div>
    </a>
    <a href="#" class="news-card">
      <div class="news-img-3"></div>
      <div class="news-title">Tech Innovations Revealing In 2026</div>
      <div class="news-source">TechRadar</div>
    </a>
    <a href="#" class="news-card">
      <div class="news-img-4"></div>
      <div class="news-title">Local Weather Updates & Forecast</div>
      <div class="news-source">Weather Network</div>
    </a>
    <a href="#" class="news-card">
      <div class="news-img-5"></div>
      <div class="news-title">Sports: Championship Highlights</div>
      <div class="news-source">Global Sports</div>
    </a>
  </div>
</body>
</html>
