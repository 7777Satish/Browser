<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Tab</title>
<style>
body {
    margin: 0;
    padding: 0;
    background: #121212;
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}
.top-bar {
    position: absolute;
    top: 24px;
    left: 24px;
    right: 24px;
    display: flex;
    justify-content: space-between;
    background: #1a1a1a;
}
.pill-group {
    display: flex;
    background: #1a1a1a;
    border-radius: 24px;
    padding: 4px;
}
.pill-item {
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
    color: #999999;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
}
.pill-item.active {
    color: #ffffff;
}
.top-right {
    display: flex;
    gap: 12px;
    background: #1a1a1a;
}
.pill-single {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #1a1a1a;
    padding: 8px 16px;
    border-radius: 24px;
    font-size: 13px;
    font-weight: 500;
    color: #999999;
}
.pill-single.active {
    color: #ffffff;
}
.dot {
    width: 8px;
    height: 8px;
    border-radius: 4px;
}
.dot-orange {
    background: #ff5722;
}
.dot-green {
    background: #00e676;
}
.main-content {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin-top: -60px;
}
.clock {
    font-size: 80px;
    font-weight: 700;
    letter-spacing: -2px;
    margin-bottom: 8px;
}
.date {
    font-size: 14px;
    margin-bottom: 40px;
}
.date-greet {
    color: #e66a40;
    font-weight: 500;
}
.date-sep {
    color: #555555;
    margin: 0 8px;
}
.date-day {
    color: #aaaaaa;
    font-weight: 500;
}
.search-container {
    width: 640px;
    background: #1e1e1e;
    border-radius: 12px;
    padding: 2px 2px;
    display: flex;
    align-items: center;
    margin-bottom: 24px;
    box-sizing: border-box;
}
.search-input {
    flex-grow: 1;
    background: transparent;
    border: none;
    color: #ffffff;
    font-size: 14px;
    outline: none;
    margin: 0 12px;
    height: 30px;
    width: 80%;
}
.search-input::placeholder {
    color: #666666;
}
.shortcut {
    background: #333333;
    color: #aaaaaa;
    padding: 4px 6px;
    border-radius: 4px;
    font-size: 11px;
    margin-right: 12px;
    font-family: monospace;
}
.apps-row {
    display: flex;
    width: 640px;
    justify-content: space-between;
    height: 70px;
}
.app-tile {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #181818;
    padding: 12px 0px;
    border-radius: 12px;
    width: 72px;
    height: 70px;
    margin: 0px 12px;
    cursor: pointer;
}
.app-icon-wrapper {
    background: #242424;
    width: 48px;
    height: 48px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 12px;
}
.app-name {
    font-size: 11px;
    color: #888888;
    font-weight: 500;
    padding-left: 10px;
    margin: 0;
}
</style>
</head>
<body>

<div class="top-bar">
    <div class="pill-group">
        <div class="pill-item" style="width: 100px; display: flex; align-items: center;">
            <div class="dot dot-orange" style="width: 5px; height: 5px; background: #ff5722; margin-top: 12px;"></div>
            Engineering
        </div>
        <div class="pill-item" style="width: 100px;">Design</div>
        <div class="pill-item" style="width: 100px;">Personal</div>
    </div>
    <div class="top-right"  style="width: 300px;">
        <div class="pill-single" style="width: 100px;">
            San Francisco, 18 C
        </div>
        <div class="pill-single" style="width: 100px;">
            Online
        </div>
    </div>
</div>

<div class="main-content" style="margin-top: 100px; height: 800px;">

    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0px 534px; box-sizing: border-box;">
      <div class="clock">11:47</div>
      <div class="date">
          <span class="date-greet">Good morning</span>
          <span class="date-sep">,</span>
          <span class="date-day">Monday, September 28</span>
      </div>
    </div>

    <div class="search-container">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e66a40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16" y2="16"></line>
        </svg>
        <input type="text" class="search-input" placeholder="Tab to search Google, or type URL...">
        <div class="shortcut">S</div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#888888" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2 a3 3 0 0 0 -3 3 v7 a3 3 0 0 0 6 0 v-7 a3 3 0 0 0 -3 -3 z"></path>
            <line x1="12" y1="19" x2="12" y2="22"></line>
            <line x1="8" y1="22" x2="16" y2="22"></line>
        </svg>
    </div>

    <div class="apps-row">
        <div class="app-tile" style="height: 70px;">
            <div class="app-icon-wrapper">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#cccccc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="8 6 2 12 8 18"></polyline>
                    <polyline points="16 6 22 12 16 18"></polyline>
                </svg>
            </div>
            <div class="app-name">GitHub</div>
        </div>
        <div class="app-tile">
            <div class="app-icon-wrapper">
                <svg style="width: 20px; height: 20px;" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#cccccc" stroke-width="2">
                    <circle cx="12" cy="12" r="4"></circle>
                    <line x1="4" y1="4" x2="20" y2="20"></line>
                </svg>
            </div>
            <div class="app-name">Figma</div>
        </div>
        <div class="app-tile">
            <div class="app-icon-wrapper">
                <svg style="width: 20px; height: 20px;" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#cccccc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="8"></circle>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
            </div>
            <div class="app-name">Linear</div>
        </div>
        <div class="app-tile">
            <div class="app-icon-wrapper">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#cccccc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="10" rx="2"></rect>
                    <circle cx="12" cy="5" r="2"></circle>
                    <line x1="12" y1="7" x2="12" y2="11"></line>
                </svg>
            </div>
            <div class="app-name">Claude</div>
        </div>
        <div class="app-tile">
            <div class="app-icon-wrapper">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#cccccc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="4" y1="6" x2="20" y2="6"></line>
                    <line x1="4" y1="12" x2="20" y2="12"></line>
                    <line x1="4" y1="18" x2="20" y2="18"></line>
                </svg>
            </div>
            <div class="app-name">Notion</div>
        </div>
        <div class="app-tile">
            <div class="app-icon-wrapper">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#cccccc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="5" width="20" height="14" rx="3"></rect>
                    <polygon points="10 9 15 12 10 15 10 9"></polygon>
                </svg>
            </div>
            <div class="app-name">YouTube</div>
        </div>
        <div class="app-tile">
            <div class="app-icon-wrapper">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#cccccc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="8" y1="3" x2="6" y2="21"></line>
                    <line x1="18" y1="3" x2="16" y2="21"></line>
                    <line x1="4" y1="9" x2="22" y2="9"></line>
                    <line x1="2" y1="15" x2="20" y2="15"></line>
                </svg>
            </div>
            <div class="app-name">X / Comms</div>
        </div>
        <div class="app-tile">
            <div class="app-icon-wrapper">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#cccccc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 11 a5 5 0 0 1 -5 5 h-8 l-5 5 v-5 a5 5 0 0 1 -2 -4 v-1 a5 5 0 0 1 5 -5 h10 a5 5 0 0 1 5 5 z"></path>
                </svg>
            </div>
            <div class="app-name">Reddit</div>
        </div>
    </div>
</div>

<img src="image_a1ce15.png" style="display: none;" alt="Reference Image">

</body>
</html>
