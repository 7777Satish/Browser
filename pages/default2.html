<!DOCTYPE html>
<html>
<head>
    <title>YouTube Clone</title>
</head>
<body style="margin:0px;background:rgb(245,245,245);font-family:Arial;">

    <div style="display:flex;height:60px;background:rgb(255,255,255);border-bottom:1px solid rgb(220,220,220);">
        <div style="width:220px;padding:18px 20px 18px 20px;">
            <span style="font-size:24px;font-weight:bold;color:rgb(255,0,0);">YouTube</span>
        </div>

        <div style="flex:1;padding:12px 0px 0px 0px;">
            <div style="display:flex;">
                <input type="text" style="width:500px;height:34px;border:1px solid rgb(200,200,200);padding:0px 10px 0px 10px;">
                </input>

                <button style="width:80px;height:38px;border:1px solid rgb(200,200,200);background:rgb(248,248,248);">
                    Search
                </button>
            </div>
        </div>

        <div style="width:200px;padding:12px 20px 0px 0px;text-align:right;">
            <button style="height:38px;border:1px solid rgb(0,120,255);background:rgb(255,255,255);color:rgb(0,120,255);padding:0px 20px 0px 20px;">
                Sign In
            </button>
        </div>
    </div>

    <div style="display:flex;">

        <div style="width:220px;background:rgb(255,255,255);border-right:1px solid rgb(220,220,220);min-height:900px;">

            <div style="padding:15px 20px 15px 20px;font-size:16px;">
                Home
            </div>

            <div style="padding:15px 20px 15px 20px;font-size:16px;">
                Shorts
            </div>

            <div style="padding:15px 20px 15px 20px;font-size:16px;">
                Subscriptions
            </div>

            <div style="padding:15px 20px 15px 20px;font-size:16px;">
                Library
            </div>

            <div style="padding:15px 20px 15px 20px;font-size:16px;">
                History
            </div>

        </div>

        <div style="flex:1;padding:20px 20px 20px 20px;">

            <div style="display:flex;flex-wrap:wrap;">

                <div style="width:320px;margin:0px 20px 20px 0px;">
                    <div style="width:320px;height:180px;background:rgb(180,180,180);">
                    </div>

                    <div style="display:flex;padding:10px 0px 0px 0px;">
                        <div style="width:40px;height:40px;background:rgb(120,120,120);border-radius:20px;">
                        </div>

                        <div style="padding:0px 0px 0px 10px;">
                            <div style="font-size:16px;font-weight:bold;color:rgb(0,0,0);">
                                Building A Code Editor In C
                            </div>

                            <div style="font-size:14px;color:rgb(100,100,100);padding:5px 0px 0px 0px;">
                                Aether Dev
                            </div>

                            <div style="font-size:14px;color:rgb(100,100,100);">
                                12000 views
                            </div>
                        </div>
                    </div>
                </div>

                <div style="width:320px;margin:0px 20px 20px 0px;">
                    <div style="width:320px;height:180px;background:rgb(170,170,170);">
                    </div>

                    <div style="display:flex;padding:10px 0px 0px 0px;">
                        <div style="width:40px;height:40px;background:rgb(110,110,110);border-radius:20px;">
                        </div>

                        <div style="padding:0px 0px 0px 10px;">
                            <div style="font-size:16px;font-weight:bold;color:rgb(0,0,0);">
                                Learn Networking From Scratch
                            </div>

                            <div style="font-size:14px;color:rgb(100,100,100);padding:5px 0px 0px 0px;">
                                Net Academy
                            </div>

                            <div style="font-size:14px;color:rgb(100,100,100);">
                                84000 views
                            </div>
                        </div>
                    </div>
                </div>

                <div style="width:320px;margin:0px 20px 20px 0px;">
                    <div style="width:320px;height:180px;background:rgb(160,160,160);">
                    </div>

                    <div style="display:flex;padding:10px 0px 0px 0px;">
                        <div style="width:40px;height:40px;background:rgb(100,100,100);border-radius:20px;">
                        </div>

                        <div style="padding:0px 0px 0px 10px;">
                            <div style="font-size:16px;font-weight:bold;color:rgb(0,0,0);">
                                HTML Renderer Project
                            </div>

                            <div style="font-size:14px;color:rgb(100,100,100);padding:5px 0px 0px 0px;">
                                Dev Studio
                            </div>

                            <div style="font-size:14px;color:rgb(100,100,100);">
                                5000 views
                            </div>
                        </div>
                    </div>
                </div>

                <div style="width:320px;margin:0px 20px 20px 0px;">
                    <div style="width:320px;height:180px;background:rgb(150,150,150);">
                    </div>

                    <div style="display:flex;padding:10px 0px 0px 0px;">
                        <div style="width:40px;height:40px;background:rgb(90,90,90);border-radius:20px;">
                        </div>

                        <div style="padding:0px 0px 0px 10px;">
                            <div style="font-size:16px;font-weight:bold;color:rgb(0,0,0);">
                                Ray Tracing Tutorial
                            </div>

                            <div style="font-size:14px;color:rgb(100,100,100);padding:5px 0px 0px 0px;">
                                Graphics Hub
                            </div>

                            <div style="font-size:14px;color:rgb(100,100,100);">
                                92000 views
                            </div>
                        </div>
                    </div>
                </div>

            </div>

        </div>

    </div>

</body>
</html>
